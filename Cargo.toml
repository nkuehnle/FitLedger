[workspace]
resolver = "3"
members = ["src-tauri", "crates/core", "crates/ocr"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# OCR inference (rten) is unusably slow unoptimized; build dependencies optimized in dev too.
[profile.dev.package."*"]
opt-level = 2
